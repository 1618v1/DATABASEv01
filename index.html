<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DATABASE</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0284c7">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root, [data-theme="light"] { --bg: #f1f5f9; --card: #fff; --text: #1e293b; --accent: #0284c7; --muted: #64748b; --green: #16a34a; --red: #dc2626; }
    [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --accent: #38bdf8; --muted: #94a3b8; --green: #4ade80; --red: #f87171; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .header { background: var(--card); padding: 16px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; }
    .header-right { display: flex; gap: 10px; }
    button { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { opacity: 0.9; }
    .status { font-size: 12px; }
    .status.online { color: var(--green); }
    .status.offline { color: var(--red); }
    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { padding: 10px 20px; background: var(--card); border: 1px solid #333; cursor: pointer; border-radius: 6px; color: var(--text); }
    .tab-btn.active { background: var(--accent); color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .upload-area { background: var(--card); padding: 20px; border-radius: 8px; margin-bottom: 16px; }
    label { display: block; margin: 8px 0; }
    input, select { padding: 8px; border: 1px solid #333; border-radius: 6px; background: var(--bg); color: var(--text); width: 100%; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
    th { background: var(--card); font-weight: 600; }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .badge-lunas { background: #dcfce7; color: #16a34a; }
    .badge-titip { background: #fef9c3; color: #ca8a04; }
    .badge-tf { background: #e0f2fe; color: #0284c7; }
    .badge-utang { background: #fee2e2; color: #dc2626; }
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    .info { background: var(--card); padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
  </style>
</head>
<body>

<header class="header">
  <div>
    <h1>📊 DATABASE</h1>
    <small style="color: var(--muted);">Penjualan • Ringkasan • Stok Gudang</small>
  </div>
  <div class="header-right">
    <span class="status" id="statusBadge">Offline</span>
    <button class="btn-primary" id="installBtn" style="display:none" onclick="installApp()">📲 Install</button>
    <button class="btn-primary" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('sales')">📈 Penjualan</button>
    <button class="tab-btn" onclick="switchTab('summary')">📊 Ringkasan</button>
    <button class="tab-btn" onclick="switchTab('stok')">📦 Stok</button>
  </div>

  <!-- SALES TAB -->
  <div id="sales" class="tab-content active">
    <div class="upload-area">
      <label class="btn-primary" style="cursor:pointer; display:inline-block; margin:0">
        📤 Upload Excel
        <input type="file" accept=".xlsx,.xls" id="fileInput" style="display:none" onchange="uploadExcel(this)">
      </label>
      <div id="fileName" class="info" style="margin-top:8px; display:none;"></div>
    </div>
    
    <div id="salesEmpty" class="empty">📂 Belum ada data penjualan</div>
    <div id="salesTable" style="display:none; overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Toko</th><th>Produk</th><th>Tanggal</th><th>Harga</th><th>Qty</th>
            <th>Total</th><th>Status</th><th>Bayar</th><th>Sisa</th>
          </tr>
        </thead>
        <tbody id="salesBody"></tbody>
      </table>
    </div>
  </div>

  <!-- SUMMARY TAB -->
  <div id="summary" class="tab-content">
    <div id="summaryEmpty" class="empty">Belum ada data</div>
    <div id="summaryContent" style="display:none;">
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px;">
        <div class="info"><strong>Total</strong><div id="totalSales" style="font-size:20px; font-weight:bold;"></div></div>
        <div class="info"><strong>Terbayar</strong><div id="totalPaid" style="font-size:20px; font-weight:bold;"></div></div>
        <div class="info"><strong>Utang</strong><div id="totalDebt" style="font-size:20px; font-weight:bold; color:var(--red);"></div></div>
        <div class="info"><strong>Transaksi</strong><div id="totalTx" style="font-size:20px; font-weight:bold;"></div></div>
      </div>
    </div>
  </div>

  <!-- STOK TAB -->
  <div id="stok" class="tab-content">
    <div class="upload-area">
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;">
        <div>
          <label>Produk</label>
          <select id="stokProduk"></select>
        </div>
        <div>
          <label>Tanggal</label>
          <input type="date" id="stokTgl">
        </div>
        <div>
          <label>Masuk</label>
          <input type="number" id="stokMasuk" value="0" min="0">
        </div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:12px;">
        <div>
          <label>Keluar</label>
          <input type="number" id="stokKeluar" value="0" min="0">
        </div>
        <div>
          <label>Stok Awal</label>
          <input type="number" id="stokAwal" value="0" min="0">
        </div>
        <div style="display:flex; align-items:flex-end;">
          <button class="btn-primary" style="width:100%" onclick="addStok()">➕ Tambah</button>
        </div>
      </div>
    </div>

    <div id="stokEmpty" class="empty">Belum ada data stok</div>
    <div id="stokTable" style="display:none; overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Produk</th><th>Tanggal</th><th>Awal</th><th>Masuk</th><th>Keluar</th><th>Saldo</th>
          </tr>
        </thead>
        <tbody id="stokBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
console.log('📱 DATABASE App Starting...');

// Supabase config
const SB_URL = 'https://hqncomzsdegqukpaeydd.supabase.co';
const SB_KEY = 'sb_publishable_e8eJOfNcckNcUpdCc5SrnQ_7GQR9hiB';

let supabaseClient;
try {
  supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);
  console.log('✅ Supabase connected');
} catch(e) {
  console.error('❌ Supabase error:', e.message);
}

// Data
let salesData = [];
let stokData = [];

// DB Init
let db;
async function initDB() {
  return new Promise((resolve) => {
    const req = indexedDB.open('DATABASE', 1);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('sales')) d.createObjectStore('sales');
      if (!d.objectStoreNames.contains('stok')) d.createObjectStore('stok');
    };
    req.onsuccess = () => {
      db = req.result;
      console.log('✅ IndexedDB ready');
      resolve();
    };
  });
}

async function loadData() {
  // Load from IndexedDB
  const tx = db.transaction(['sales', 'stok'], 'readonly');
  const sales = await new Promise(r => {
    tx.objectStore('sales').get('data').onsuccess = (e) => r(e.target.result?.data || []);
  });
  const stok = await new Promise(r => {
    tx.objectStore('stok').get('data').onsuccess = (e) => r(e.target.result?.data || []);
  });
  salesData = sales;
  stokData = stok;
  console.log('📦 Loaded from cache:', sales.length, 'sales,', stok.length, 'stok');
  render();
}

async function saveData() {
  const tx = db.transaction(['sales', 'stok'], 'readwrite');
  tx.objectStore('sales').put({ data: salesData }, 'data');
  tx.objectStore('stok').put({ data: stokData }, 'data');
  await new Promise(r => { tx.oncomplete = r; });
  
  // Sync to Supabase
  if (navigator.onLine && supabaseClient) {
    try {
      await supabaseClient.from('sales_data').upsert({ id: 'main', data: JSON.stringify(salesData) });
      await supabaseClient.from('stok_data').upsert({ id: 'main', data: JSON.stringify(stokData) });
      console.log('✅ Synced to Supabase');
      updateStatus('online');
    } catch(e) {
      console.error('❌ Sync failed:', e.message);
      updateStatus('error');
    }
  }
}

// Upload Excel
function uploadExcel(input) {
  const file = input.files[0];
  if (!file) return;
  console.log('📤 Reading file:', file.name);

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const wsname = wb.SheetNames[0];
      const ws = wb.Sheets[wsname];
      const data = XLSX.utils.sheet_to_json(ws);
      console.log('✅ Loaded', data.length, 'rows from Excel');

      salesData = data.map((r, i) => ({
        id: i,
        toko: r.Toko || '',
        produk: r.Produk || '',
        tanggal: r.Tanggal || '',
        harga: Number(r.Harga) || 0,
        qty: Number(r.Qty) || 0,
        total: Number(r.Total) || 0,
        status: r.Status || 'Lunas',
        bayar: Number(r.Bayar) || 0,
      }));

      saveData();
      document.getElementById('fileName').textContent = '✅ ' + file.name + ' (' + salesData.length + ' baris)';
      document.getElementById('fileName').style.display = 'block';
      input.value = '';
    } catch(e) {
      alert('❌ Error: ' + e.message);
      console.error(e);
    }
  };
  reader.readAsArrayBuffer(file);
}

function addStok() {
  const produk = document.getElementById('stokProduk').value;
  const tgl = document.getElementById('stokTgl').value;
  const masuk = Number(document.getElementById('stokMasuk').value) || 0;
  const keluar = Number(document.getElementById('stokKeluar').value) || 0;
  const awal = Number(document.getElementById('stokAwal').value) || 0;

  if (!produk || !tgl) {
    alert('⚠️ Isi produk dan tanggal');
    return;
  }

  stokData.push({
    id: Date.now(),
    produk, tgl, awal, masuk, keluar,
  });

  saveData();
  document.getElementById('stokMasuk').value = '0';
  document.getElementById('stokKeluar').value = '0';
  document.getElementById('stokAwal').value = '0';
}

// Render
function render() {
  renderSales();
  renderStok();
  updateStokOptions();
}

function renderSales() {
  const tbody = document.getElementById('salesBody');
  const empty = document.getElementById('salesEmpty');
  const table = document.getElementById('salesTable');

  if (salesData.length === 0) {
    empty.style.display = 'block';
    table.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  table.style.display = 'block';

  tbody.innerHTML = salesData.map(r => {
    const sisa = r.total - r.bayar;
    const statusClass = {
      'Lunas': 'badge-lunas',
      'Titip': 'badge-titip',
      'TF': 'badge-tf',
      'Utang': 'badge-utang'
    }[r.status] || 'badge-utang';

    return `<tr>
      <td>${r.toko}</td>
      <td>${r.produk}</td>
      <td>${r.tanggal}</td>
      <td>Rp ${r.harga.toLocaleString('id-ID')}</td>
      <td>${r.qty}</td>
      <td>Rp ${r.total.toLocaleString('id-ID')}</td>
      <td><span class="badge ${statusClass}">${r.status}</span></td>
      <td>Rp ${r.bayar.toLocaleString('id-ID')}</td>
      <td style="color:${sisa > 0 ? 'var(--red)' : 'var(--green)'}">Rp ${sisa.toLocaleString('id-ID')}</td>
    </tr>`;
  }).join('');
}

function renderSummary() {
  if (salesData.length === 0) {
    document.getElementById('summaryEmpty').style.display = 'block';
    document.getElementById('summaryContent').style.display = 'none';
    return;
  }

  const total = salesData.reduce((s, r) => s + r.total, 0);
  const paid = salesData.reduce((s, r) => s + r.bayar, 0);
  const debt = total - paid;

  document.getElementById('summaryEmpty').style.display = 'none';
  document.getElementById('summaryContent').style.display = 'grid';
  document.getElementById('totalSales').textContent = 'Rp ' + total.toLocaleString('id-ID');
  document.getElementById('totalPaid').textContent = 'Rp ' + paid.toLocaleString('id-ID');
  document.getElementById('totalDebt').textContent = 'Rp ' + debt.toLocaleString('id-ID');
  document.getElementById('totalTx').textContent = salesData.length;
}

function renderStok() {
  const tbody = document.getElementById('stokBody');
  const empty = document.getElementById('stokEmpty');
  const table = document.getElementById('stokTable');

  if (stokData.length === 0) {
    empty.style.display = 'block';
    table.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  table.style.display = 'block';

  tbody.innerHTML = stokData.map(r => {
    const saldo = r.awal + r.masuk - r.keluar;
    return `<tr>
      <td>${r.produk}</td>
      <td>${r.tgl}</td>
      <td>${r.awal}</td>
      <td>${r.masuk}</td>
      <td>${r.keluar}</td>
      <td style="color:${saldo < 0 ? 'var(--red)' : 'var(--green)'}">${saldo}</td>
    </tr>`;
  }).join('');
}

function updateStokOptions() {
  const sel = document.getElementById('stokProduk');
  const products = [...new Set(salesData.map(r => r.produk).filter(p => p))].sort();
  sel.innerHTML = '<option>- Pilih produk -</option>' +
    products.map(p => `<option>${p}</option>`).join('') +
    '<option>+ Produk baru</option>';
  
  sel.onchange = () => {
    if (sel.value === '+ Produk baru') {
      const p = prompt('Nama produk baru:');
      if (p) sel.innerHTML += `<option selected>${p}</option>`;
    }
  };
}

// UI
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
  
  document.getElementById(tab).classList.add('active');
  event.target.classList.add('active');

  if (tab === 'summary') renderSummary();
}

function toggleTheme() {
  const html = document.documentElement;
  const theme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
}

function updateStatus(status) {
  const badge = document.getElementById('statusBadge');
  badge.textContent = status === 'online' ? '✅ Tersync' : '⚠️ Offline';
  badge.className = 'status ' + status;
}

function installApp() {
  // PWA install logic
}

// Init
window.addEventListener('online', () => updateStatus('online'));
window.addEventListener('offline', () => updateStatus('offline'));

if (!navigator.onLine) updateStatus('offline');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  document.getElementById('installBtn').style.display = 'block';
  window.deferredPrompt = e;
});

document.addEventListener('DOMContentLoaded', async () => {
  await initDB();
  await loadData();
  const theme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  
  const d = new Date();
  document.getElementById('stokTgl').valueAsDate = d;
  
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(e => console.warn(e));
  }
  
  console.log('🚀 App ready!');
});
</script>

</body>
</html>
